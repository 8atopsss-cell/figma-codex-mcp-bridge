<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Figma Codex Bridge</title>
    <style>/* STYLE */</style>
  </head>
  <body>
    <main id="plugin-view" data-connected="false">
      <h1><span class="plugin-icon" aria-hidden="true">/* ICON */</span><span class="connection-indicator" aria-hidden="true"></span>Figma ↔ Codex</h1>
      <form id="pair-form">
        <label for="pairing-code">Код подключения</label>
        <input id="pairing-code" type="password" autocomplete="off" spellcheck="false" required />
        <button type="submit">Подключить</button>
      </form>
      <p id="status" role="status">Ожидание подключения</p>
      <section id="confirmation" role="alertdialog" aria-label="Подтверждение удаления" hidden>
        <p>Удалить узел <strong id="confirm-target"></strong>?</p>
        <div class="actions">
          <button id="cancel-delete" type="button">Отмена</button>
          <button id="confirm-delete" type="button">Удалить</button>
        </div>
      </section>
    </main>
    <script>/* SCRIPT */</script>
  </body>
</html>
